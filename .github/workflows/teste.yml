# Testa toda mudança e, em pull request, publica um LINK DE TESTE
# (canal de prévia do Firebase, expira em 7 dias). Não mexe na produção
# nem no banco de dados.
name: Testar e gerar link de teste

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  testar:
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
      - name: Link de teste (só em pull request)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: traco-integrado-sig
          expires: 7d
