# Testa toda mudança e, em pull request, publica um LINK DE TESTE
# (canal de prévia do Firebase, expira em 7 dias). Não mexe na produção
# nem no banco de dados.
name: Testar e gerar link de teste

# Só em pull request (antes rodava duas vezes: no push E no pull request).
on:
  pull_request:
  workflow_dispatch:

# um push novo cancela o teste antigo do mesmo pull request
concurrency:
  group: teste-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  testar:
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
      # v1.28: teste de ponta a ponta — o app de verdade num navegador, ligado a
      # um banco de TESTE (emuladores), entrando como cada perfil. Nunca toca no
      # banco real. Ver tests/e2e/roteiro.mjs.
      - name: Preparar teste de ponta a ponta
        run: |
          cd scripts && npm ci --omit=dev && cd ..
          npx playwright install --with-deps chromium
      - name: Cache do emulador
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emuladores-firebase-13
      - name: Teste de ponta a ponta (perfis, gravação, lixeira, sincronização)
        run: npx --yes firebase-tools@13 emulators:exec --config firebase.e2e.json --only auth,firestore,hosting --project traco-integrado-sig "node tests/e2e/roteiro.mjs"
      - name: Link de teste (só em pull request)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: traco-integrado-sig
          expires: 7d
