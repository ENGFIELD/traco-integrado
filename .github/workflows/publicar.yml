# Publicar em produção. Roda em dois casos:
#  1) automático: quando uma mudança entra na branch main (o Claude faz o
#     merge assim que os testes passam — autorização do dono, ver CLAUDE.md);
#  2) manual: Actions → Run workflow, digitando PUBLICAR.
# Antes de publicar: testes, build e BACKUP do
# banco (guardado como anexo privado do workflow por 90 dias; no máximo um a
# cada 20 h — ver backup-diario.yml). Depois marca a
# versão com uma tag producao-AAAA-MM-DD-HHMM para dar para voltar.
name: Publicar em produção

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite PUBLICAR para confirmar'
        required: true
      regras:
        description: 'Publicar também as regras do banco (firestore.rules)?'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read # v1.30: ver se já existe backup do dia

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  publicar:
    if: github.event_name == 'push' || github.event.inputs.confirmacao == 'PUBLICAR'
    runs-on: ubuntu-latest
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico para saber se firestore.rules mudou
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            scripts/package-lock.json
      - run: npm ci
      # regras do banco: publica se pedido no "Run workflow" OU se o arquivo mudou neste push
      - name: As regras do banco mudaram?
        id: regras
        run: |
          if [ "${{ github.event.inputs.regras }}" = "true" ]; then echo "publicar=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          ANTES="${{ github.event.before }}"
          if [ -n "$ANTES" ] && git cat-file -e "$ANTES^{commit}" 2>/dev/null \
             && git diff --name-only "$ANTES" "${{ github.sha }}" | grep -qx 'firestore.rules'; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

      - name: Chave do Firebase (só durante este workflow)
        env:
          CHAVE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$CHAVE" > "$RUNNER_TEMP/chave.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/chave.json" >> "$GITHUB_ENV"

      # v1.30: o backup lê o banco inteiro. Para não gastar a cota diária grátis
      # em dias de muitas publicações, ele roda no máximo uma vez a cada 20 h:
      # se já existe um backup recente (o diário automático ou o de outra
      # publicação), esta publicação usa aquele.
      - name: Já existe backup recente?
        id: backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LIMITE=$(date -u -d '20 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          RECENTE=$(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq "[.artifacts[] | select((.name|startswith(\"backup-firestore\")) and (.expired|not) and .created_at > \"$LIMITE\")] | length" || echo 0)
          echo "Backups nas últimas 20 h: $RECENTE"
          if [ "${RECENTE:-0}" -gt 0 ]; then echo "fazer=false" >> "$GITHUB_OUTPUT"; else echo "fazer=true" >> "$GITHUB_OUTPUT"; fi
      - name: Backup do banco antes de publicar
        if: steps.backup.outputs.fazer == 'true'
        run: |
          cd scripts && npm ci --omit=dev && cd ..
          node scripts/backup-firestore.js --key "$GOOGLE_APPLICATION_CREDENTIALS"
      - uses: actions/upload-artifact@v4
        if: steps.backup.outputs.fazer == 'true'
        with:
          name: backup-firestore
          path: backups/firestore_*.json
          retention-days: 90

      - name: Publicar site
        run: npx --yes firebase-tools@13 deploy --only hosting --project traco-integrado-sig --non-interactive
      # v1.15: as regras são testadas no emulador antes e publicadas pela
      # biblioteca oficial (scripts/publicar-regras.js). O "firebase deploy
      # --only firestore:rules" dava 403: ele usa uma API de teste que a conta
      # do GitHub não tem permissão de usar.
      - name: Cache do emulador
        if: steps.regras.outputs.publicar == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: emuladores-firebase-13
      - name: Testar regras do banco (emulador)
        if: steps.regras.outputs.publicar == 'true'
        run: npx --yes firebase-tools@13 emulators:exec --config firebase.test.json --only firestore --project demo-traco-regras-v1 "node --test tests/regras/regras-v1.test.mjs"
      - name: Publicar regras do banco
        if: steps.regras.outputs.publicar == 'true'
        run: node scripts/publicar-regras.js

      - name: Marcar a versão publicada
        run: |
          TAG="producao-$(TZ=America/Sao_Paulo date +%Y-%m-%d-%H%M)"
          git tag "$TAG" && git push origin "$TAG"

      - name: Apagar a chave
        if: always()
        run: rm -f "$RUNNER_TEMP/chave.json"
